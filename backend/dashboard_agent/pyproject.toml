[project]
name = "dashboard_agent"
version = "0.0.1"
description = "An agent that can interact with and manipulate slides."
authors = [
    { name = "Thothy", email = "ai.thothy@gmail.com" },
]
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.7",
    "langgraph-checkpoint>=2.0.26",
    "langgraph-sdk>=0.1.67",
    "langgraph-prebuilt>=0.1.9",
    "langchain>=0.3.25",
    "langchain-core>=0.3.63",
    "langchain-openai>=0.3.21",
    "langchain-anthropic>=0.3.14",
    "langchain-google-genai>=2.1.5",
    "langchain-community>=0.3.24",
    "langmem>=0.0.26",
    "psycopg[binary,pool]>=3.2.9",
    "sqlmodel>=0.0.24",
    "sqlalchemy>=2.0.0",
    "python-pptx>=1.0.2",
    "python-docx>=1.1.2",
    "pdfplumber>=0.11.6",
    "fastembed>=0.7.0",
    "pydantic>=2.11.5",
    "python-dotenv>=1.1.0",
    "psycopg2>=2.9.0",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.4.8", "pytest-asyncio>=0.23.7"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["dashboard_graph"]
[tool.setuptools.package-dir]
"dashboard_graph" = "src/dashboard_graph"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = ["UP006", "UP007", "UP035", "D417", "E501"]
include = ["*.py", "*.pyi", "*.ipynb"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
ignore_errors = true
