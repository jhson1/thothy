[project]
name = "data_research_agent"
version = "0.0.1"
description = "Research agent for Thothy"
authors = [
    { name = "Thothy" }
]
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4.7",
    "langchain>=0.3.25",
    "langchain-core>=0.3.63",
    "langchain-community>=0.3.24",
    "langchain-openai>=0.3.18",
    "tavily-python>=0.5.2",
    "duckduckgo-search>=7.4.0",
    "beautifulsoup4>=4.12.3",
    "exa-py>=1.1.4",
    "aiohttp>=3.9.5",
    "httpx>=0.28.1",
    "markdownify>=0.13.1",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "langsmith>=0.3.43",
    "typing-extensions>=4.11.0",
    "pydantic>=2.11.5",
]

[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.4.8"]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["data_research_graph"]

[tool.setuptools.package-dir]
"data_research_graph" = "src/data_research_graph"

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    "UP035",
    "D417",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"